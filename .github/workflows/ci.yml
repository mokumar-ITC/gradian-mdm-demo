# Continuous integration: runs on every pull request and every push to main.
#   build-and-test  restore (fails on vulnerable packages), build with warnings as errors, unit tests
#   e2e             the app against a throwaway PostgreSQL 17, driven through HTTP by tests/e2e
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore (NuGet audit fails on known vulnerabilities)
        run: dotnet restore Gradian.Mdm.sln

      - name: Build
        run: dotnet build Gradian.Mdm.sln --configuration Release --no-restore -warnaserror

      - name: Unit tests
        run: >
          dotnet test Gradian.Mdm.sln --configuration Release --no-build
          --logger "trx;LogFileName=unit-tests.trx" --results-directory test-results

      - name: List outdated or deprecated packages (informational)
        if: always()
        run: dotnet list Gradian.Mdm.sln package --deprecated || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-test-results
          path: test-results
          retention-days: 14

  e2e:
    name: End-to-end tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container that only accepts connections from this job
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gradian_mdm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: gradian_mdm
      ConnectionStrings__Mdm: Host=localhost;Port=5432;Database=gradian_mdm;Username=postgres
      Database__Provider: PostgreSql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build
        run: dotnet build src/Gradian.Mdm.Web --configuration Debug

      - name: Load schema and seed data, start the app, run every e2e suite
        run: python tests/e2e/run_all.py --reset --start

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-app-log
          path: e2e-app.log
          retention-days: 7
